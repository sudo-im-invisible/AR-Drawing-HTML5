<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="brush" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bbbbbb"/>
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Рамка-трафарет -->
  <rect x="96" y="96" width="320" height="320" rx="24" fill="none"
        stroke="#555" stroke-width="6" stroke-dasharray="14 10"/>

  <!-- Кисть (диагональ) -->
  <g transform="rotate(-45 256 256)">
    <!-- ручка -->
    <rect x="238" y="160" width="36" height="180" rx="8" fill="url(#brush)"/>
    <!-- обойма -->
    <rect x="232" y="330" width="48" height="28" rx="6" fill="#9a9a9a"/>
    <!-- ворс -->
    <path d="M 236 358 Q 256 420 276 358 Z" fill="#e8e8e8"/>
  </g>

  <!-- Капля краски -->
  <circle cx="360" cy="380" r="26" fill="#ff6b6b"/>
  <circle cx="352" cy="372" r="6" fill="#ff9a9a" opacity="0.7"/>

  <!-- Маленькие точки-брызги -->
  <circle cx="400" cy="320" r="7" fill="#ffd93d"/>
  <circle cx="415" cy="360" r="5" fill="#ffd93d" opacity="0.8"/>
  <circle cx="390" cy="415" r="4" fill="#ffd93d" opacity="0.6"/>
</svg>
